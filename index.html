<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validador de classificação</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#2457d6;--ok:#087443;--warn:#b54708;--danger:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}
.top{max-width:1200px;margin:auto;display:flex;gap:16px;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:18px}.status{font-size:12px;color:var(--muted)}
main{max-width:1200px;margin:24px auto;padding:0 16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.stats{margin-left:auto;color:var(--muted);font-size:14px}
button,select{font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}
.primary{background:var(--accent);color:white}.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:14px 0;overflow:hidden;box-shadow:0 2px 8px rgba(16,24,40,.04)}
.card-head{display:flex;gap:12px;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);align-items:flex-start}
.id{font-weight:800}.meta{color:var(--muted);font-size:13px;margin-top:4px}
.caption{padding:18px;white-space:pre-wrap;line-height:1.55;max-height:230px;overflow:auto}
.metrics{display:flex;gap:16px;flex-wrap:wrap;padding:0 18px 16px;color:#475467;font-size:14px}.pill{background:#f2f4f7;padding:5px 9px;border-radius:999px}
.post-preview{padding:0 18px 18px}.post-preview-box{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.post-preview-label{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.instagram-wrap{display:flex;justify-content:center;overflow:auto;padding:12px;background:#fafbfc;min-height:160px}
.instagram-wrap .instagram-media{margin:0!important;max-width:540px!important;min-width:326px!important;width:100%!important}
.embed-fallback{padding:18px;text-align:center;color:var(--muted);font-size:13px}.embed-fallback a{color:var(--accent);font-weight:700;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 18px 18px}
.field{border:1px solid var(--line);border-radius:12px;padding:12px}.label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px}
.value{font-weight:700;line-height:1.4}.help{font-size:12px;color:var(--muted);margin-top:5px}
.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.choices label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:7px 9px;border-radius:9px;cursor:pointer;font-size:13px}.choices input{accent-color:var(--accent)}
.correction{display:none;margin-top:9px}.correction.show{display:block}.correction select{width:100%;padding:9px;border:1px solid #cfd4dc;border-radius:9px;background:#fff}
.actions{display:flex;justify-content:flex-end;gap:9px;padding:14px 18px;background:#fafbfc;border-top:1px solid var(--line)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}.error{background:#fef3f2;color:var(--danger);padding:12px 14px;border-radius:10px;margin-bottom:15px}
.loading{padding:24px;text-align:center;color:var(--muted)}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{width:auto;margin-left:auto}.card-head{flex-direction:column}.instagram-wrap{padding:8px;overflow-x:auto}}
</style>
</head>
<body>
<header><div class="top"><div><div class="brand">Validador de classificação</div><div class="status" id="mode">Preparando…</div></div><div class="status" id="userStatus"></div></div></header>

<main>
  <div id="error"></div>
  <div class="toolbar"><span class="stats" id="stats"></span></div>
  <section id="list"><div class="loading">Carregando próxima postagem…</div></section>
</main>

<script src="data.js"></script>
<script>
const SUPABASE_URL = "https://feglwhsfuezhnbshkpcb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_960sfyhw5KP_cbAnGyYJBQ_AfxigIt2";

let client=null,production=false,current=[];
const $=id=>document.getElementById(id);

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function fmt(n){return Number(n||0).toLocaleString("pt-BR");}
function originalFormat(r){return r.formato?.trim()?r.formato.trim():"Não informado";}

let instagramEmbedPromise=null;
function loadInstagramEmbed(){
  if(window.instgrm?.Embeds){return Promise.resolve();}
  if(instagramEmbedPromise)return instagramEmbedPromise;
  instagramEmbedPromise=new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.async=true;
    s.src="https://www.instagram.com/embed.js";
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error("Não foi possível carregar a prévia do Instagram."));
    document.head.appendChild(s);
  });
  return instagramEmbedPromise;
}

async function init(){
  if(SUPABASE_URL&&SUPABASE_ANON_KEY){await loadSupabase();}
  else{$("mode").textContent="Modo local de demonstração — configure o Supabase para uso simultâneo";loadLocal();}
  await loadItems();
}

async function loadSupabase(){
  const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
  await new Promise((res,rej)=>{s.onload=res;s.onerror=rej;document.head.appendChild(s)});
  client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const {data,error}=await client.auth.getSession();if(error)throw error;
  if(!data.session){const r=await client.auth.signInAnonymously();if(r.error)throw r.error;}
  production=true;$('mode').textContent="Conectado ao banco compartilhado";$('userStatus').textContent="Avaliador anônimo";
}

function loadLocal(){
  const saved=JSON.parse(localStorage.getItem("validation_results")||"{}");
  current=window.SOURCE_DATA.map((x,i)=>({...x,_id:i,...saved[x.shortCode]})).filter(x=>!x.validacao_1&&!x.validacao_2).slice(0,1);
}

async function loadItems(){
  $("error").innerHTML="";
  $("list").innerHTML='<div class="loading">Carregando próxima postagem…</div>';
  try{
    if(production){
      const {data,error}=await client.rpc("claim_validation_items",{p_limit:1});
      if(error)throw error;
      current=data||[];
    }else loadLocal();
    render();
  }catch(e){
    $("list").innerHTML="";
    $("error").innerHTML='<div class="error"><b>Erro:</b> '+esc(e.message||e)+'</div>';
  }
}

function render(){
  $("stats").textContent=current.length?"1 postagem por vez":"Fila vazia";
  if(!current.length){
    $("list").innerHTML='<div class="empty"><h2>🎉 Nada pendente</h2><p>Não há postagens aguardando validação neste momento.</p></div>';
    return;
  }
  $("list").innerHTML=card(current[0],0);
  bindCard(0);
  processInstagramEmbed(current[0]);
}

function bindCard(i){
  document.querySelectorAll(`[data-index="${i}"] input[name="cat-${i}"]`).forEach(x=>x.onchange=()=>toggle(i,"cat"));
  document.querySelectorAll(`[data-index="${i}"] input[name="sub-${i}"]`).forEach(x=>x.onchange=()=>toggle(i,"sub"));
  document.querySelectorAll(`[data-index="${i}"] input[name="fmt-${i}"]`).forEach(x=>x.onchange=()=>toggle(i,"fmt"));
  const catSel=document.querySelector(`[data-index="${i}"] select[name="cat-select"]`);catSel.onchange=()=>updateSubs(i,catSel.value);
  document.querySelector(`[data-index="${i}"] .save`).onclick=()=>save(i);
}

async function processInstagramEmbed(r){
  const box=document.querySelector(`[data-index="0"] .instagram-wrap`);
  if(!box)return;
  if(!r.url){box.innerHTML='<div class="embed-fallback">Esta postagem não possui URL cadastrada.</div>';return;}
  try{
    await loadInstagramEmbed();
    if(window.instgrm?.Embeds){window.instgrm.Embeds.process();}
    setTimeout(()=>{
      const placeholder=box.querySelector("blockquote.instagram-media");
      if(placeholder && !placeholder.querySelector("iframe")){
        placeholder.outerHTML='<div class="embed-fallback">Não foi possível carregar a prévia automaticamente. <a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">Abrir postagem no Instagram ↗</a></div>';
      }
    },3500);
  }catch(e){
    box.innerHTML='<div class="embed-fallback">Prévia indisponível no momento. <a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">Abrir postagem no Instagram ↗</a></div>';
  }
}

function radio(name,value,label,checked=false){return `<label><input type="radio" name="${name}" value="${value}" ${checked?'checked':''}>${label}</label>`}
function catOptions(selected){return '<option value="">Selecione…</option>'+window.CATEGORIES.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join("")}
function subOptions(cat,selected){const a=window.CATEGORY_SUBCATEGORIES[cat]||["Outros"];return '<option value="">Selecione…</option>'+a.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join("")}

function card(r,i){
  const fmtCurrent=originalFormat(r);
  const preview=r.url?`<blockquote class="instagram-media" data-instgrm-permalink="${esc(r.url)}" data-instgrm-version="14"><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Ver esta postagem no Instagram</a></blockquote>`:'<div class="embed-fallback">Esta postagem não possui URL cadastrada.</div>';

  return `<article class="card" data-index="${i}">
    <div class="card-head"><div><div class="id">${esc(r.shortCode||"Postagem "+(i+1))}</div><div class="meta">${esc(r.data||"")}</div></div></div>
    <div class="caption">${esc(r.caption)}</div>
    <div class="metrics"><span class="pill">♥ ${fmt(r.likes)} curtidas</span><span class="pill">💬 ${fmt(r.comentarios)} comentários</span></div>

    <div class="post-preview">
      <div class="post-preview-box">
        <div class="post-preview-label">Prévia da postagem</div>
        <div class="instagram-wrap">${preview}</div>
      </div>
    </div>

    <div class="grid">
      <div class="field"><div class="label">Categoria</div><div class="value">Original: ${esc(r.categoria||"Não informado")}</div>
        <div class="choices">${radio("cat-"+i,"ok","✓ OK",true)}${radio("cat-"+i,"corrigir","Corrigir")}</div>
        <div class="correction" id="cat-box-${i}"><select name="cat-select">${catOptions("")}</select><div class="help">Opções permitidas: Personalista, Programático ou Outros.</div></div>
      </div>
      <div class="field"><div class="label">Subcategoria</div><div class="value">Original: ${esc(r.subcategoria||"Não informado")}</div>
        <div class="choices">${radio("sub-"+i,"ok","✓ OK",true)}${radio("sub-"+i,"corrigir","Corrigir")}</div>
        <div class="correction" id="sub-box-${i}"><select name="sub-select">${subOptions(r.categoria,"")}</select><div class="help">A lista muda conforme a categoria escolhida.</div></div>
      </div>
      <div class="field"><div class="label">Formato</div><div class="value">Atual: ${esc(fmtCurrent)}</div>
        <div class="choices">${radio("fmt-"+i,"manter","✓ Manter",true)}${radio("fmt-"+i,"ia","Produzido por IA")}</div>
        <div class="help">A decisão fica gravada diretamente na coluna <code>formato</code>.</div>
      </div>
    </div>
    <div class="actions"><button class="primary save">Confirmar validação</button></div>
  </article>`;
}

function toggle(i,kind){
  const root=document.querySelector(`[data-index="${i}"]`);const val=root.querySelector(`input[name="${kind}-${i}"]:checked`).value;
  const box=root.querySelector(`#${kind}-box-${i}`);if(box)box.classList.toggle("show",val==="corrigir");
}
function updateSubs(i,cat){const root=document.querySelector(`[data-index="${i}"]`);root.querySelector('select[name="sub-select"]').innerHTML=subOptions(cat,"");}

async function save(i){
  const r=current[i],root=document.querySelector(`[data-index="${i}"]`);
  const catMode=root.querySelector(`input[name="cat-${i}"]:checked`).value;
  const subMode=root.querySelector(`input[name="sub-${i}"]:checked`).value;
  const fmtMode=root.querySelector(`input[name="fmt-${i}"]:checked`).value;
  const catVal=catMode==="ok"?"OK":root.querySelector('select[name="cat-select"]').value;
  const subVal=subMode==="ok"?"OK":root.querySelector('select[name="sub-select"]').value;
  const fmtVal=fmtMode==="ia"?"Produzido por IA":(r.formato?.trim()||null);

  if(catMode==="corrigir"&&!catVal)return alert("Selecione a categoria corrigida.");
  if(catMode==="corrigir"&&subMode==="ok")return alert("Como a categoria foi corrigida, valide também a subcategoria conforme a nova categoria.");
  if(subMode==="corrigir"&&!subVal)return alert("Selecione a subcategoria corrigida.");
  if(catMode==="corrigir"&&catVal!=="Outros"&&subMode==="corrigir"&&subVal!=="Outros"){
    const allowed=window.CATEGORY_SUBCATEGORIES[catVal]||[];
    if(!allowed.includes(subVal))return alert("A subcategoria escolhida não pertence à categoria selecionada.");
  }

  const btn=root.querySelector(".save");btn.disabled=true;btn.textContent="Salvando…";
  try{
    if(production){
      const {error}=await client.rpc("save_validation",{p_id:r.id,p_validacao_1:catVal,p_validacao_2:subVal,p_formato:fmtVal});
      if(error)throw error;
    }else{
      const saved=JSON.parse(localStorage.getItem("validation_results")||"{}");
      saved[r.shortCode]={validacao_1:catVal,validacao_2:subVal,formato:fmtVal||""};
      localStorage.setItem("validation_results",JSON.stringify(saved));
    }

    // A próxima postagem é carregada automaticamente após cada validação.
    await loadItems();
  }catch(e){
    btn.disabled=false;btn.textContent="Confirmar validação";
    alert("Não foi possível salvar: "+(e.message||e));
  }
}

init().catch(e=>{$("error").innerHTML='<div class="error"><b>Erro de inicialização:</b> '+esc(e.message||e)+'</div>';});
</script>
</body></html>
